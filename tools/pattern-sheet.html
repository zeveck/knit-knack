<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Knit Knack — pattern contact sheet</title>
<style>
  body { margin: 0; padding: 16px 18px 30px; background: #2e2230; color: #f3e9dc; font: 13px/1.3 system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 18px 0 8px; color: #e9c77b; }
  .note { opacity: 0.75; margin-bottom: 8px; }
  .grid { display: flex; flex-wrap: wrap; gap: 12px; }
  figure { margin: 0; width: 248px; background: #4a3548; border-radius: 10px; padding: 8px; box-sizing: border-box; }
  .pic { height: 232px; display: flex; align-items: center; justify-content: center; }
  figcaption { margin-top: 6px; }
  figcaption b { color: #fff; }
  .meta { opacity: 0.7; font-size: 11px; }
  .err { color: #ff8a8a; font-size: 11px; white-space: pre-wrap; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 2px; vertical-align: -1px; border: 1px solid #0004; }
</style>
</head>
<body>
<h1>Knit Knack — the 47 patterns</h1>
<div class="note">Each preview is the finished front drawn by work.js renderSwatch from the pattern's chart, in its suggested yarns. Finishing touches (pom-poms, tassels, button eyes, buttons, loops) are sketched on top.</div>
<div id="out"></div>
<script type="module">
import { parseChart } from '../game/src/chart.js';
import { renderSwatch } from '../game/src/work.js';
import { PATTERNS, PALETTE, CHAPTERS } from '../game/src/patterns.js';

const params = new URLSearchParams(location.search);
const only = params.get('ch') ? params.get('ch').split(',').map(Number) : null;
const ids = params.get('id') ? params.get('id').split(',') : null;
const BOX = +(params.get('box') || 232);
const out = document.getElementById('out');
let section = null, chap = 0;

function touches(g, p, ch, cell, m) {
  const t = p.touch; if (!t) return;
  const H = cell * 0.72;
  const X = (c) => m + c * cell + cell / 2, Y = (r) => m + H * 0.4 + (ch.height - r) * H + H / 2;
  const col = (slot) => PALETTE[(p.slots[slot] || p.slots.A).color];
  const top = ch.row(ch.height);
  const midTop = (Math.min(...top.cols) + Math.max(...top.cols)) / 2;
  g.save();
  if (t.kind === 'pompom') {
    const cx = X(midTop), cy = Y(ch.height) - H * 1.6, R = cell * 2.2;
    g.fillStyle = col(t.slot || 'A');
    for (let i = 0; i < 70; i++) { const a = i * 2.39, rr = R * Math.sqrt((i + 0.5) / 70); g.beginPath(); g.arc(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, cell * 0.45, 0, 7); g.fill(); }
    g.strokeStyle = '#0003'; g.beginPath(); g.arc(cx, cy, R + cell * 0.3, 0.2, 2.9); g.stroke();
  } else if (t.kind === 'tassel') {
    const cx = X(midTop), cy = Y(ch.height) - H * 0.6;
    g.strokeStyle = col('A'); g.lineWidth = Math.max(1, cell * 0.12);
    for (let i = -4; i <= 4; i++) { g.beginPath(); g.moveTo(cx, cy); g.quadraticCurveTo(cx + i * cell * 0.12, cy - cell * 1.2, cx + i * cell * 0.22, cy - cell * 3.2); g.stroke(); }
    g.fillStyle = col('A'); g.beginPath(); g.arc(cx, cy - cell * 0.9, cell * 0.4, 0, 7); g.fill();
  } else if (t.kind === 'button-eyes' || t.kind === 'buttons') {
    for (const [r, c] of t.cells) {
      g.fillStyle = t.kind === 'buttons' ? col(t.slot || 'A') : '#1b1416';
      g.beginPath(); g.arc(X(c), Y(r), cell * (t.kind === 'buttons' ? 0.5 : 0.42), 0, 7); g.fill();
      g.fillStyle = '#ffffff66'; g.beginPath(); g.arc(X(c) - cell * 0.12, Y(r) - cell * 0.12, cell * 0.12, 0, 7); g.fill();
    }
  } else if (t.kind === 'loop') {
    const c = t.at === 'top-right' ? Math.max(...top.cols) - 0.5 : midTop;
    g.strokeStyle = col('B' in p.slots ? 'B' : 'A'); g.lineWidth = Math.max(1.5, cell * 0.2);
    g.beginPath(); g.ellipse(X(c), Y(ch.height) - cell * 1.0, cell * 0.6, cell * 1.0, 0, Math.PI * 0.95, Math.PI * 2.05); g.stroke();
  } else if (t.kind === 'drawstring') {
    const r = ch.height - 1, a = Math.min(...top.cols), b = Math.max(...top.cols);
    g.strokeStyle = col(t.slot || 'A'); g.lineWidth = Math.max(1.5, cell * 0.18);
    g.beginPath(); g.moveTo(X(a) - cell * 0.4, Y(r)); g.lineTo(X(b) + cell * 0.4, Y(r)); g.stroke();
    const cx = X((a + b) / 2); g.beginPath(); g.ellipse(cx - cell * 0.6, Y(r) - cell * 0.4, cell * 0.6, cell * 0.35, -0.4, 0, 7); g.ellipse(cx + cell * 0.6, Y(r) - cell * 0.4, cell * 0.6, cell * 0.35, 0.4, 0, 7); g.stroke();
  }
  g.restore();
}

PATTERNS.forEach((p, n) => {
  if (only && !only.includes(p.chapter)) return;
  if (ids && !ids.includes(p.id)) return;
  if (p.chapter !== chap) {
    chap = p.chapter;
    const h = document.createElement('h2'); h.textContent = `Chapter ${chap}. ${CHAPTERS[chap - 1]}`; out.append(h);
    section = document.createElement('div'); section.className = 'grid'; out.append(section);
  }
  const fig = document.createElement('figure');
  const box = document.createElement('div'); box.className = 'pic'; fig.append(box);
  const ch = parseChart(p);
  const cap = document.createElement('figcaption');
  const sw = Object.values(p.slots).map((s) => `<span class="sw" style="background:${PALETTE[s.color]}"></span>`).join('');
  cap.innerHTML = `<b>${n + 1}. ${p.name}</b><br><span class="meta">${sw} ${ch.width}×${ch.height} · ${ch.total} sts · ${p.technique}</span>`;
  if (ch.errors.length) cap.innerHTML += `<div class="err">${ch.errors.slice(0, 4).join('\n')}</div>`;
  fig.append(cap);
  section.append(fig);
  if (ch.errors.length) return;
  const cell = Math.max(3, Math.floor(Math.min((BOX - 30) / (ch.width + 1.6), (BOX - 40) / ((ch.height + 3.4) * 0.72))));
  const yarnOf = (slot) => { const s = p.slots[slot] || p.slots.A; return { color: PALETTE[s.color], type: s.type }; };
  const m = Math.round(cell * (p.touch && /pompom|tassel|loop/.test(p.touch.kind) ? 3.6 : 1.2));
  try {
    const { canvas } = renderSwatch(ch, { yarnAt: (i) => { const L = ch.locate(i); return yarnOf(L ? L.entry.slot : 'A'); }, cellPx: cell, castOnYarn: yarnOf(ch.cell(1, ch.row(1).cols[0]).slot), background: null, margin: m });
    const g = canvas.getContext('2d');
    touches(g, p, ch, cell, m);
    canvas.style.maxWidth = '232px'; canvas.style.maxHeight = BOX + 'px';
    box.append(canvas);
  } catch (e) { cap.innerHTML += `<div class="err">${e.message}</div>`; }
});
document.body.dataset.ready = '1';
</script>
</body>
</html>
