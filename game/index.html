<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Knit Knack: a cozy tap-to-knit game</title>
<meta name="description" content="Tap, tap, tap: knit anything, one real stitch at a time. Work through a book of 47 real knitting patterns in your own colors, fill your gallery wall, and grow an Infinite Scarf that one day might reach the Moon.">
<meta name="theme-color" content="#2a1f3d">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Knit Knack">
<meta property="og:type" content="website">
<meta property="og:title" content="Knit Knack: a cozy tap-to-knit game">
<meta property="og:description" content="Every tap knits one real stitch. 47 real patterns, your own colors and yarns, a gallery wall, dolls to dress, and a scarf that never ends.">
<link rel="canonical" href="https://knitknack.synapticnoise.com/">
<meta property="og:url" content="https://knitknack.synapticnoise.com/">
<meta property="og:image" content="https://knitknack.synapticnoise.com/social-card.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A cream cat asleep in a wicker basket beside a ball of cranberry yarn, in a lamplit knitting nook, with the words Knit Knack.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Knit Knack: a cozy tap-to-knit game">
<meta name="twitter:description" content="Every tap knits one real stitch. 47 real patterns, your own colors and yarns, and a scarf that never ends.">
<meta name="twitter:image" content="https://knitknack.synapticnoise.com/social-card.jpg">
<meta name="twitter:image:alt" content="A cream cat asleep in a wicker basket beside a ball of cranberry yarn, in a lamplit knitting nook, with the words Knit Knack.">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="fonts/Fredoka.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Caveat.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/bg/nook-land.webp" as="image">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="features.css">
<script src="vendor/report.js"></script>
</head>
<body>
<div id="app">
  <section data-screen="title" class="screen title-screen booting">
    <canvas id="title-canvas" aria-hidden="true"></canvas>
    <div class="title-ui">
      <h1 class="logo" aria-label="Knit Knack"><span class="logo-a">Knit</span><span class="logo-b">Knack</span></h1>
      <p class="logo-sub">tap, tap, tap: knit anything, one real stitch at a time</p>
    </div>
    <button class="tap-start" id="tap-start">Tap to start</button>
    <a class="title-link title-link-gallery" href="https://synapticnoise.com/" title="More games at synapticnoise.com">synapticnoise.com</a>
    <a class="title-link title-link-gh" href="https://github.com/zeveck/knit-knack" target="_blank" rel="noopener" title="Knit Knack on GitHub: how it was made">GitHub</a>
  </section>
  <section data-screen="book" class="screen paper-screen book-screen" hidden></section>
  <section data-screen="caston" class="screen paper-screen caston-screen" hidden></section>
  <section data-screen="knit" class="screen knit-screen" hidden></section>
  <section data-screen="finished" class="screen finished-screen" hidden></section>
  <section data-screen="gallery" class="screen gallery-screen" hidden></section>
  <section data-screen="bag" class="screen placeholder-screen" hidden></section>
  <section data-screen="dolls" class="screen placeholder-screen" hidden></section>
  <section data-screen="scarf" class="screen placeholder-screen" hidden></section>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="sheet-layer" hidden></div>
<div id="notice" role="status" hidden></div>
<script type="module" src="src/main.js"></script>
<script type="module" src="vendor/gh-feedback.js"></script>
<gh-feedback id="report" trigger="none" repo="zeveck/knit-knack" template="bug.yml"
  heading="Report a bug" types="bug,feature" theme="light" color="#9e2a3a"></gh-feedback>
</body>
</html>
