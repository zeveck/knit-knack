<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face { font-family: 'Fredoka'; src: url('../game/fonts/Fredoka.woff2'); font-weight: 300 700; }
@font-face { font-family: 'Caveat'; src: url('../game/fonts/Caveat.woff2'); }
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#2a1f3d}
.bg{position:absolute;inset:0;background:url('../game/assets/bg/nook-land.webp') center 70%/cover;filter:brightness(.62) saturate(.95)}
.v{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,rgba(12,6,24,0) 40%,rgba(12,6,24,.7))}
.stack{position:absolute;left:150px;top:300px;width:360px;height:360px}
.stack img{position:absolute;left:0;top:0;width:360px}
.purl{left:36px!important;top:-56px!important;width:288px!important}
.ball{position:absolute;left:420px;top:460px;width:140px;height:140px;background:#b8344a;-webkit-mask:url('../game/assets/items/yarn-wool.png') center/contain no-repeat;mask:url('../game/assets/items/yarn-wool.png') center/contain no-repeat}.ball img{width:100%;height:100%;mix-blend-mode:multiply}
h1{position:absolute;right:110px;top:150px;margin:0;font-family:Fredoka;font-weight:700;font-size:130px;line-height:.95;text-align:center;color:#f6ecd9;text-shadow:0 5px 0 #7a1e2c,0 10px 28px rgba(0,0,0,.6)}
h1 span{display:block}h1 .b{color:#f2d48a;transform:rotate(3deg)}h1 .a{transform:rotate(-4deg)}
p{position:absolute;right:90px;top:430px;width:520px;margin:0;font-family:Caveat;font-size:40px;color:#f3e3c4;text-align:center;text-shadow:0 2px 10px #000}
</style></head><body><div class="bg"></div><div class="v"></div>
<div class="stack"><img src="../game/assets/sprites/basket-back.png"><img class="purl" src="../game/assets/sprites/purl-cat.png"><img src="../game/assets/sprites/basket-front.png"></div>
<div class="ball"><img src="../game/assets/items/yarn-wool.png"></div>
<h1><span class="a">Knit</span><span class="b">Knack</span></h1><p>every tap knits one real stitch</p></body></html>
